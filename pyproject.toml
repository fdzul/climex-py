[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "climex-py"
version = "0.2.0"
description = "Climate data of Mexico from the NASA POWER API: daily, monthly or climatological temperature, precipitation, humidity, wind and radiation for a set of points."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Felipe Antonio Dzul Manzanilla", email = "felipe.dzul.m@gmail.com" },
    { name = "Fabián Correa-Morales", email = "fabiancorrea@msn.com" },
    { name = "Emmanuel Morales García", email = "emmorales@uv.mx" },
    { name = "Cecilia Cruz López", email = "ceccruz@uv.mx" },
    { name = "Héctor Gómez-Dantés", email = "hector.gomez@insp.mx" },
]
keywords = ["mexico", "climate", "nasa-power", "temperature", "precipitation", "dengue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://fdzul.github.io/climex-py/"
Source = "https://github.com/fdzul/climex-py"
Issues = "https://github.com/fdzul/climex-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/climex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
